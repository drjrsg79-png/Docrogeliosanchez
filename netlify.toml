[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Las funciones declaran sus propias rutas /api/... con `export const config`.
# Todo lo demás se resuelve en el cliente (SPA).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
